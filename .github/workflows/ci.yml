name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: these jobs build and test untrusted PR code and need no
# write access. Without this block the token inherits the repository default.
permissions:
  contents: read

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    services:
      # pgvector image so the notes.embedding Vector column and cosine-distance
      # queries work; used only by the Postgres test leg below.
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: aether_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      # Generate a throwaway Fernet key per run instead of committing one to the
      # repo. Exported to $GITHUB_ENV so both test legs below inherit it.
      - name: Generate ephemeral test encryption key
        run: |
          echo "ENCRYPTION_KEY=$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')" >> "$GITHUB_ENV"

      - name: Lint with ruff
        run: ruff check .

      - name: Run tests (SQLite)
        run: pytest -q

      # Re-run the full suite against real Postgres + pgvector to cover the
      # dialect-specific SQL and the native vector-search path (the pgvector
      # tests are skipped on the SQLite leg above).
      - name: Run tests (Postgres + pgvector)
        env:
          # ENCRYPTION_KEY is inherited from $GITHUB_ENV (generated above).
          TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/aether_test
        run: pytest -q

  # Known-vulnerable dependencies fail the build. Its own job, so the audit
  # tool's dependencies never mix with the environment the tests run in.
  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc

      # Audits the hashed lock — exactly what the image installs, transitive
      # packages included — without installing it.
      - name: Audit Python dependencies (pip-audit)
        run: |
          pip install --require-hashes -r .github/requirements-audit.txt
          pip-audit --strict --disable-pip -r api/requirements.txt -r api/requirements-dev.txt

      # Shipped (production) frontend dependencies: no high/critical advisories.
      - name: Audit npm dependencies
        working-directory: web
        run: npm audit --omit=dev --audit-level=high

  eval-gate:
    name: RAG eval gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: api/requirements-dev.txt

      - name: Install dependencies
        run: pip install --require-hashes -r requirements-dev.txt

      # Runs the RAG eval harness on the deterministic offline backend and fails
      # the build if any aggregate (faithfulness / context precision / answer
      # relevancy / retrieval recall) drops below its floor — catches regressions
      # in retrieval or the metric pipeline (e.g. FM-1) before they merge. No API
      # keys needed; the offline backend produces stable scores over the golden set.
      - name: Run RAG eval gate
        run: python -m app.eval.run --offline --check --json-only

  frontend:
    name: Frontend (lint + build + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: web/.nvmrc
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Run tests
        run: npm run test

  frontend-image:
    name: Frontend image (build + Trivy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      # Keep in step with deploy.yml's build-scan job.
      TRIVY_VERSION: "0.76.1"
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build with fresh base images and verify Node runtime
        run: docker build --pull --no-cache --progress=plain -t aether-web:ci web

      - name: Install Trivy (pinned, checksum-verified)
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          sudo tar -xzf "$RUNNER_TEMP/$archive" -C /usr/local/bin trivy

      # The same gate the API image passes before it ships.
      - name: Trivy scan (blocks on HIGH/CRITICAL)
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --no-progress aether-web:ci

      - name: Image does not run as root
        run: test "$(docker image inspect aether-web:ci --format '{{.Config.User}}')" = "101"
