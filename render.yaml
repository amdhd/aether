databases:
  - name: aether-db
    plan: free
    postgresMajorVersion: 16

services:
  - type: web
    name: aether-api
    runtime: docker
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    # /docs is disabled when ENVIRONMENT=production (see api/app/main.py), so
    # pointing the health check at it would 404 forever and the service would
    # never come up. /health is the liveness endpoint and checks no dependencies,
    # so a transient DB blip won't cycle the instance.
    healthCheckPath: /health
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: aether-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ENCRYPTION_KEY
        sync: false
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # Refresh cookie: cross-site (Vercel frontend + Render API) needs Secure
      # cookies with SameSite=None so the browser will send them.
      - key: REFRESH_COOKIE_SECURE
        value: "true"
      - key: REFRESH_COOKIE_SAMESITE
        value: none
      # Render terminates TLS at its own edge and forwards to the container, so
      # the socket peer the app sees is that proxy, not the caller. Without
      # these, per-IP auth rate limiting buckets every user in the world under
      # one address: 10 logins per minute for the entire service, and no
      # per-attacker limiting at all. One Render proxy in front = 1 hop.
      - key: TRUST_PROXY_HEADERS
        value: "true"
      - key: TRUSTED_PROXY_HOPS
        value: "1"
      - key: FRONTEND_ORIGIN
        sync: false
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      # Semantic note search. Render's managed Postgres supports pgvector; the
      # migration runs CREATE EXTENSION vector automatically.
      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
