name: Deploy

# CD with inline gates (cost · IaC · container CVEs) → OIDC deploy to ECS.
# The full platform-level version of these gates (Lambda-based, with auto-rollback
# and PR reporting) is a separate showcase: github.com/amdhd/pipelineguard.
#
# On pull_request: gates run and block the merge (→ block the deploy).
# On push to main / manual dispatch: gates run, then build → push → migrate →
# deploy — but the push/deploy steps activate only once AWS_DEPLOY_ROLE_ARN is
# set, so the workflow stays green on main until OIDC is wired up.
#
# Required repo settings before this works:
#   vars.AWS_DEPLOY_ROLE_ARN   IAM role trusting this repo's GitHub OIDC provider
#                              (layer1_persistent output `github_deploy_role_arn`)
#   environment `production`   restricted to the main branch, ideally with
#                              required reviewers. The deploy role trusts only
#                              tokens minted for this environment, so nothing a
#                              pull request runs can assume it.
#   secrets.INFRACOST_API_KEY  from `infracost auth login` / Infracost Cloud
#
# Third-party actions are pinned to full commit SHAs (version in the trailing
# comment): a tag can be moved to new code by whoever controls the action's repo,
# a SHA cannot. Dependabot proposes the bumps.
on:
  pull_request:
    branches: [main]
    paths: ["api/**", "web/**", "infra/**", ".github/workflows/deploy.yml"]
  push:
    branches: [main]
    paths: ["api/**", "web/**", "infra/**", ".github/workflows/deploy.yml"]
  workflow_dispatch:

# Least privilege by default; each job asks for only what it uses. In
# particular, `id-token: write` (OIDC → AWS) is granted only to the two jobs that
# run in the `production` environment, never to a job that builds PR code.
permissions:
  contents: read

env:
  AWS_REGION: ap-southeast-1
  NAME_PREFIX: aether
  ECR_REPOSITORY: aether-api

jobs:
  # --- Gate 1: infrastructure static analysis (Checkov) ---
  iac-security:
    name: Gate · IaC (Checkov)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # Checkov SARIF → Security tab
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Enforcing IaC gate. Every accepted exception is documented with a reason
      # in infra/terraform/.checkov.yaml; anything NOT fixed or listed there fails
      # the build. Findings are also uploaded to the Security tab (SARIF).
      - name: Checkov
        id: checkov
        uses: bridgecrewio/checkov-action@45edc9d8856b664db2ec251f5f8632361f0a67aa # v12.3139.0
        with:
          directory: infra/terraform
          config_file: infra/terraform/.checkov.yaml
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: false

      - name: Upload Checkov SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: checkov.sarif
          category: checkov

  # --- Gate 2: cost (Infracost) ---
  cost:
    name: Gate · Cost (Infracost)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write # Infracost PR comment
    # Inert until INFRACOST_API_KEY is configured — the steps skip (job stays
    # green) rather than failing the PR when the key is absent.
    env:
      INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
      # Fail the PR if it raises estimated monthly cost by more than this (USD).
      COST_INCREASE_LIMIT_USD: "10"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Note if Infracost key is missing
        if: env.INFRACOST_API_KEY == ''
        run: echo "::notice::INFRACOST_API_KEY not set — cost gate skipped. Add the secret to enable it."

      # Pin an exact CLI version. The action's default (`0.10.x`) is a semver
      # *range*, which makes it page through the whole GitHub releases list to
      # resolve — a call that twice reddened this gate (504, then an API
      # timeout). An exact version skips that lookup and downloads the release
      # asset directly. Retry once anyway, so a flaky download doesn't block
      # the deploy. Bump deliberately, like the pinned Terraform version.
      - name: Setup Infracost
        id: infracost_setup
        if: env.INFRACOST_API_KEY != ''
        continue-on-error: true
        uses: infracost/actions/setup@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832 # v3.0.1
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          version: "0.10.45"

      - name: Setup Infracost (retry)
        if: env.INFRACOST_API_KEY != '' && steps.infracost_setup.outcome == 'failure'
        uses: infracost/actions/setup@e9d6e6cd65e168e76b0de50ff9957d2fe8bb1832 # v3.0.1
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
          version: "0.10.45"

      - name: Baseline cost (target branch)
        if: env.INFRACOST_API_KEY != '' && github.event_name == 'pull_request'
        run: |
          git checkout ${{ github.event.pull_request.base.sha }}
          infracost breakdown --config-file infra/infracost.yml \
            --format json --out-file /tmp/base.json
          git checkout ${{ github.event.pull_request.head.sha }}

      - name: Cost diff + comment (PR)
        if: env.INFRACOST_API_KEY != '' && github.event_name == 'pull_request'
        run: |
          infracost diff --config-file infra/infracost.yml \
            --compare-to /tmp/base.json --format json --out-file /tmp/diff.json
          infracost comment github --path /tmp/diff.json \
            --repo ${{ github.repository }} \
            --pull-request ${{ github.event.pull_request.number }} \
            --github-token ${{ secrets.GITHUB_TOKEN }} \
            --behavior update

      - name: Enforce cost-increase threshold
        if: env.INFRACOST_API_KEY != '' && github.event_name == 'pull_request'
        run: |
          increase=$(jq -r '.diffTotalMonthlyCost // "0"' /tmp/diff.json)
          echo "Estimated monthly cost increase: \$$increase (limit: \$$COST_INCREASE_LIMIT_USD)"
          if awk "BEGIN{exit !($increase > $COST_INCREASE_LIMIT_USD)}"; then
            echo "::error::Cost increase \$$increase/mo exceeds the \$$COST_INCREASE_LIMIT_USD/mo limit"
            exit 1
          fi

      - name: Cost breakdown (push/dispatch)
        if: env.INFRACOST_API_KEY != '' && github.event_name != 'pull_request'
        run: infracost breakdown --config-file infra/infracost.yml

  # --- Gate 3: build image + container CVE scan (Trivy). No cloud credentials. ---
  build-scan:
    name: Gate · Image (Trivy)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      image_tag: ${{ github.sha }}
    env:
      # Bump deliberately: update both values from the release's checksums file.
      TRIVY_VERSION: "0.76.1"
      TRIVY_SHA256: c7cbe3137fb8a48a17574bede3dd6beb16742d1e9772929940fc90082c39d9c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # arm64 image (Fargate runs Graviton) built on an amd64 runner needs QEMU.
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image (load locally for scanning)
        run: |
          docker buildx build --platform linux/arm64 \
            -t aether-api:${{ github.sha }} --load ./api

      # A pinned release verified against a pinned digest. Piping install.sh from
      # the project's main branch ran whatever that branch held at the time, in
      # the job that produces the image we ship.
      - name: Install Trivy (pinned, checksum-verified)
        run: |
          archive="trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          curl -fsSLo "$RUNNER_TEMP/$archive" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/${archive}"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          sudo tar -xzf "$RUNNER_TEMP/$archive" -C /usr/local/bin trivy
          trivy --version

      - name: Trivy scan (blocks on HIGH/CRITICAL)
        run: |
          trivy image --scanners vuln --severity HIGH,CRITICAL \
            --ignore-unfixed --exit-code 1 --no-progress \
            aether-api:${{ github.sha }}

      # Hand the exact scanned image to the publish job instead of rebuilding it
      # there, so what ships is byte-for-byte what passed the scan.
      - name: Export scanned image
        if: github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
        run: docker save aether-api:${{ github.sha }} | gzip > "$RUNNER_TEMP/aether-api.tar.gz"

      - name: Upload scanned image
        if: github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: aether-api-image
          path: ${{ runner.temp }}/aether-api.tar.gz
          retention-days: 1

  # --- Publish: push the scanned image to ECR (main only, production env) ---
  publish:
    name: Publish image to ECR
    runs-on: ubuntu-latest
    needs: [build-scan]
    if: github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC → AWS, no long-lived keys
    steps:
      - name: Download scanned image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: aether-api-image
          path: ${{ runner.temp }}

      - name: Load scanned image
        run: gunzip -c "$RUNNER_TEMP/aether-api.tar.gz" | docker load

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Push to ECR
        run: |
          registry=$(aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" \
            --query 'repositories[0].repositoryUri' --output text)
          aws ecr get-login-password --region "$AWS_REGION" \
            | docker login --username AWS --password-stdin "${registry%/*}"
          # Tags are immutable. A re-run of this commit finds its image already
          # published (same source, already scanned) and reuses it.
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
               --image-ids imageTag="${{ github.sha }}" >/dev/null 2>&1; then
            echo "Image ${{ github.sha }} already in ECR; reusing it."
            exit 0
          fi
          docker tag aether-api:${{ github.sha }} "$registry:${{ github.sha }}"
          docker push "$registry:${{ github.sha }}"

  # --- Deploy: migrate then roll the service (only after all gates pass) ---
  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: [iac-security, cost, build-scan, publish]
    # Skips (stays green) until the OIDC deploy role is configured.
    if: github.event_name != 'pull_request' && vars.AWS_DEPLOY_ROLE_ARN != ''
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC → AWS, no long-lived keys
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Register new task definition with the new image
        id: taskdef
        run: |
          registry=$(aws ecr describe-repositories --repository-names "$ECR_REPOSITORY" \
            --query 'repositories[0].repositoryUri' --output text)
          image="$registry:${{ needs.build-scan.outputs.image_tag }}"

          # Take the current task def, swap the image, strip read-only fields, re-register.
          aws ecs describe-task-definition --task-definition "${NAME_PREFIX}-api" \
            --query 'taskDefinition' --output json > current.json
          jq --arg IMAGE "$image" '
            .containerDefinitions[0].image = $IMAGE
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' current.json > new.json

          arn=$(aws ecs register-task-definition --cli-input-json file://new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "arn=$arn" >> "$GITHUB_OUTPUT"

          # The migration task is a separate family: it alone holds the database
          # owner login. Same image swap.
          aws ecs describe-task-definition --task-definition "${NAME_PREFIX}-migrate" \
            --query 'taskDefinition' --output json > migrate-current.json
          jq --arg IMAGE "$image" '
            .containerDefinitions[0].image = $IMAGE
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes,
                  .compatibilities, .registeredAt, .registeredBy)
          ' migrate-current.json > migrate-new.json
          migrate_arn=$(aws ecs register-task-definition --cli-input-json file://migrate-new.json \
            --query 'taskDefinition.taskDefinitionArn' --output text)
          echo "migrate_arn=$migrate_arn" >> "$GITHUB_OUTPUT"

      - name: Run migrations (one-off task)
        run: |
          net=$(aws ecs describe-services --cluster "$NAME_PREFIX" --services "${NAME_PREFIX}-api" \
            --query 'services[0].networkConfiguration.awsvpcConfiguration' --output json)
          subnets=$(echo "$net" | jq -r '.subnets | join(",")')
          sgs=$(echo "$net" | jq -r '.securityGroups | join(",")')

          # The migrate task definition runs `alembic upgrade head` itself.
          task=$(aws ecs run-task --cluster "$NAME_PREFIX" \
            --task-definition "${{ steps.taskdef.outputs.migrate_arn }}" \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[$subnets],securityGroups=[$sgs],assignPublicIp=DISABLED}" \
            --query 'tasks[0].taskArn' --output text)

          aws ecs wait tasks-stopped --cluster "$NAME_PREFIX" --tasks "$task"
          code=$(aws ecs describe-tasks --cluster "$NAME_PREFIX" --tasks "$task" \
            --query 'tasks[0].containers[0].exitCode' --output text)
          echo "migration exit code: $code"
          test "$code" = "0" || { echo "Migration failed"; exit 1; }

      - name: Deploy service (circuit breaker auto-rolls back on failure)
        run: |
          aws ecs update-service --cluster "$NAME_PREFIX" --service "${NAME_PREFIX}-api" \
            --task-definition "${{ steps.taskdef.outputs.arn }}" >/dev/null
          echo "Waiting for the service to reach steady state..."
          aws ecs wait services-stable --cluster "$NAME_PREFIX" --services "${NAME_PREFIX}-api"
          echo "Deploy complete."
